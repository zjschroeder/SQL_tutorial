# =============================================================================
# Auto-deploy the Shinylive static bundle to GitHub Pages on every push to main.
#
# How it works:
#   1. Spin up Ubuntu, install R.
#   2. Install the shinylive R package.
#   3. Run shinylive::export(".", "docs") — this also downloads the WebAssembly
#      packages we need (incl. DBI + RSQLite) from repo.r-wasm.org and bakes them
#      into docs/. No local R install required on your machine.
#   4. Publish docs/ to GitHub Pages.
#
# ONE-TIME SETUP: in the repo, go to Settings -> Pages and set "Source" to
# "GitHub Actions". After that, every push to main republishes the live site
# automatically (watch progress under the Actions tab).
# =============================================================================
name: Deploy Shinylive to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:  # manual trigger button in the Actions UI

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install shinylive
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            shinylive

      - name: Export the app to docs/
              run: Rscript shinylive_export.R

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
